server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: ms-academico
          uri: lb://ms-academico
          predicates:
            - Path=/api/academico/**
          filters:
            - StripPrefix=2

        - id: ms-professor
          uri: lb://ms-professor
          predicates:
            - Path=/api/professores/**
          filters:
            - StripPrefix=2

        - id: ms-disciplina
          uri: lb://ms-disciplina
          predicates:
            - Path=/api/disciplinas/**
          filters:
            - StripPrefix=2

        - id: ms-bibliografia
          uri: lb://ms-bibliografia
          predicates:
            - Path=/api/bibliografias/**
          filters:
            - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
