server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: ms-academico
          uri: lb://ms-academico
          predicates:
            - Path=/api/academico/**
          filters:
            - StripPrefix=2

        - id: ms-professor
          uri: lb://ms-professor
          predicates:
            - Path=/api/professores/**,/api/formacoes/**,/api/professor-portal/**
          filters:
            - StripPrefix=1

        - id: ms-disciplina
          uri: lb://ms-disciplina
          predicates:
            - Path=/api/disciplinas/**,/api/programas/**
          filters:
            - StripPrefix=1

        - id: ms-bibliografia
          uri: lb://ms-bibliografia
          predicates:
            - Path=/api/bibliografias/**
          filters:
            - StripPrefix=1

        - id: ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: ms-relatorio
          uri: lb://ms-disciplina
          predicates:
            - Path=/api/relatorios/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
